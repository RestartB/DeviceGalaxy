services:
  db:
    image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: devicegalaxy
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: devicegalaxy
    volumes:
      - pgdata:/var/lib/postgresql
  devicegalaxy:
    image: restartb/devicegalaxy:latest
    container_name: devicegalaxy
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - './data:/data'
    env_file:
      - .env
volumes:
  pgdata:
